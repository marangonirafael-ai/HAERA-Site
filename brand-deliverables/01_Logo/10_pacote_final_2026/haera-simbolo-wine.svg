<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>HAËRA - Núcleo Nutritivo</title>
  <!-- Camadas concêntricas representando o núcleo nutritivo -->
  <!-- Camada externa - halo difuso -->
  <circle cx="400" cy="400" r="350" fill="#722F37" fill-opacity="0.08"/>
  <!-- Segunda camada -->
  <circle cx="400" cy="400" r="280" fill="#722F37" fill-opacity="0.12"/>
  <!-- Terceira camada -->
  <circle cx="400" cy="400" r="200" fill="#722F37" fill-opacity="0.2"/>
  <!-- Quarta camada -->
  <circle cx="400" cy="400" r="130" fill="#722F37" fill-opacity="0.35"/>
  <!-- Núcleo central sólido -->
  <circle cx="400" cy="400" r="70" fill="#722F37"/>
</svg>